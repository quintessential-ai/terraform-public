net.ipv4.ip_forward = 1

# Forwarded packets leave on the interface they arrived on. A redirect would tell the nodes to skip
# the appliance.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.eth0.send_redirects = 0

# Every connection of the cluster through this instance takes an entry, about 320 bytes each.
net.netfilter.nf_conntrack_max = 262144
